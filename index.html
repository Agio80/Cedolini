<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cedolino</title>
<style>
:root{--bg:#f6f8fa;--ink:#1b2430;--mut:#6b7684;--riga:#dde3ea;--acc:#0f5f73;--ok:#c9ecd2;--ko:#f6c9c9;--giallo:#fff1a8;--sf:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141a21;--ink:#e6ebf1;--mut:#97a3b1;--riga:#2c3541;--acc:#5cc0d6;--ok:#1f4a2c;--ko:#5a2424;--giallo:#5b4f10;--sf:#1b232c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 12px 120px}
h1{font-size:20px;margin:6px 0 12px}
h2{font-size:14px;margin:18px 0 6px;padding:5px 8px;border-left:4px solid var(--acc);background:var(--sf)}
.riga{display:flex;gap:8px;align-items:center;margin:4px 0}
.riga label{flex:0 0 42%;font-weight:600}
.riga input,.riga select,.box input{flex:1;min-width:0;padding:8px;font:inherit;text-align:right;border:1px solid var(--riga);border-radius:6px;background:var(--sf);color:var(--ink);font-variant-numeric:tabular-nums}
.riga select{text-align:left}
input.giallo{background:var(--giallo)}input[readonly]{background:transparent;border-style:dashed}
button{padding:10px 14px;font:inherit;border-radius:6px;border:1px solid var(--acc);background:var(--sf);color:var(--acc);cursor:pointer}
button.p{background:var(--acc);color:var(--sf)}button:disabled{opacity:.5}
.box{max-width:340px;margin:60px auto;display:grid;gap:10px}.box input{text-align:left}
#barra{position:fixed;left:0;right:0;bottom:0;padding:10px 12px;background:var(--sf);border-top:1px solid var(--riga)}
#sq{max-width:720px;margin:0 auto 8px;padding:8px;border-radius:6px;text-align:center;font-weight:700;background:var(--riga)}
#sq.ok{background:var(--ok)}#sq.ko{background:var(--ko)}
#bt{max-width:720px;margin:0 auto;display:flex;gap:8px}#bt button{flex:1}
#esito{margin-top:14px}.msg{padding:10px;border-radius:6px;white-space:pre-wrap}.msg.ok{background:var(--ok)}.msg.ko{background:var(--ko)}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}th,td{border:1px solid var(--riga);padding:4px 6px;text-align:left}td.n{text-align:right;font-variant-numeric:tabular-nums}
.nasc{display:none}
#nav{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}#nav button.on{background:var(--acc);color:var(--sf)}
.sc{overflow-x:auto}tr.tot td{font-weight:700}th.n{text-align:right}
</style>
</head>
<body>
<main>
<h1>Cedolino</h1>
<div id="login" class="box">
  <input id="em" type="email" placeholder="Email" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <button class="p" onclick="entra()">Entra</button>
  <div id="lerr"></div>
</div>
<div id="app" class="nasc">
  <div id="nav"><button data-t="ins" class="on" onclick="vai('ins')">Inserisci</button><button data-t="mese" onclick="vai('mese')">Mese</button><button data-t="anni" onclick="vai('anni')">Anni</button><button data-t="cu" onclick="vai('cu')">CU</button><button data-t="730" onclick="vai('730')">730</button></div>
  <div id="t_ins">
  <div id="info"></div>
  <div id="blocchi"></div>
  <div id="esito"></div>
  <details id="imp" style="margin-top:24px"><summary>Importa lo storico (CSV)</summary>
    <p>Scegli il file CSV scaricato dal foglio Database. Prima ti mostro il riepilogo, poi confermi.</p>
    <input type="file" id="fcsv" accept=".csv,text/csv">
    <div id="rimp"></div>
  </details>
  </div>
  <div id="t_mese" class="nasc"></div><div id="t_anni" class="nasc"></div><div id="t_cu" class="nasc"></div><div id="t_730" class="nasc"></div>
</div>
</main>
<div id="barra" class="nasc">
  <div id="sq">Compila il netto</div>
  <div id="bt"><button onclick="prova()">Prova</button><button class="p" id="bArc" onclick="archivia(false)">Archivia</button><button onclick="nuovo()">Nuovo</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ==== DA COMPILARE: li trovi in Supabase > Project Settings > API ====
const SUPABASE_URL = 'https://gqqqmnjyjtxyvqrypgkd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_pWW3RId2OnNfcupr_wMixg_KlTXFuQ9';

// Data delle scritture nel file GnuCash: come la tua calcolaDataCompetenza
// (13 = 20/12, 14 = 20/06, gli altri mesi = ultimo giorno del mese).
function dataCompetenza(anno, mese) {
  if (mese === 13) return '20/12/' + anno;
  if (mese === 14) return '20/06/' + anno;
  const ultimo = new Date(anno, mese, 0).getDate();
  return ultimo + '/' + (mese < 10 ? '0' + mese : mese) + '/' + anno;
}

const MSG_SB = 'Non riesco a collegarmi a Supabase: compila le due righe INCOLLA_QUI all\'inizio del codice (oppure manca la connessione).';
let sb = null;
try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; }
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let PROF, P = {}, C = [], S = [], ULT = {}, toccato = {}, sc = {};
const $ = id => document.getElementById(id);
const arr = (x, n) => { n = n === undefined ? 2 : n; const f = Math.pow(10, n); return Math.round(x * f) / f; };
const se = (c, a, b) => c ? a : b;
const r2 = x => Math.round(x * 100) / 100;
const fmt = n => n.toFixed(2).replace('.', ',');

function num(s) {
  s = String(s).trim().replace(/\s/g, '').replace('€', '');
  if (s === '') return 0;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}
function valuta(formula, scope) {
  const nomi = Object.keys(scope);
  return new Function(...nomi, 'arr', 'se', 'abs', 'min', 'max', 'return (' + formula + ');')
    (...nomi.map(n => scope[n]), arr, se, Math.abs, Math.min, Math.max);
}

async function entra() {
  $('lerr').textContent = '';
  if (!sb) { $('lerr').textContent = MSG_SB; return; }
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) { $('lerr').textContent = 'Accesso non riuscito: ' + error.message; return; }
  carica();
}

async function carica() {
  const { data: pr, error } = await sb.from('ced_profili').select('*').order('creato').limit(1);
  if (error || !pr.length) { $('lerr').textContent = 'Non trovo il profilo dei cedolini.'; return; }
  PROF = pr[0];
  const q = t => sb.from(t).select('*').eq('profilo_id', PROF.id).order('ordine');
  const [a, b, c] = await Promise.all([sb.from('ced_parametri').select('*').eq('profilo_id', PROF.id), q('ced_caselle'), q('ced_scritture')]);
  P = {}; a.data.forEach(r => { P[r.nome] = /^-?\d+(\.\d+)?$/.test(r.valore) ? Number(r.valore) : r.valore; });
  C = b.data; S = c.data;
  await leggiUltimo();
  $('login').classList.add('nasc'); $('app').classList.remove('nasc'); $('barra').classList.remove('nasc');
  disegna(); nuovo();
}

async function leggiUltimo() {
  const u = await sb.from('ced_cedolini').select('anno,mese,valori').ilike('datore', P.datore || '')
    .gte('mese', 1).lte('mese', 12).order('anno', { ascending: false }).order('mese', { ascending: false }).limit(1);
  ULT = u.data && u.data.length ? u.data[0] : {};
}

function disegna() {
  $('info').textContent = 'Datore: ' + (P.datore || '');
  const cont = $('blocchi'); cont.innerHTML = ''; let cur = null, box;
  C.forEach(c => {
    if (!c.etichetta) return;
    if (c.blocco !== cur) { cur = c.blocco; const h = document.createElement('h2'); h.textContent = cur; cont.appendChild(h); box = document.createElement('div'); cont.appendChild(box); }
    const d = document.createElement('div'); d.className = 'riga';
    const l = document.createElement('label'); l.textContent = c.etichetta; if (c.nota) l.title = c.nota; d.appendChild(l);
    let f;
    if (c.sigla === 'mese') {
      f = document.createElement('select');
      MESI.forEach((m, i) => f.add(new Option((i + 1) + ' - ' + m, i + 1)));
      f.add(new Option('13 - Tredicesima', 13)); f.add(new Option('14 - Quattordicesima', 14));
    } else { f = document.createElement('input'); f.type = 'text'; f.inputMode = 'decimal'; f.autocomplete = 'off'; if (c.come === 'calcola') f.readOnly = true; }
    f.id = 'f_' + c.sigla;
    if (!f.readOnly) {
      f.addEventListener('input', () => { toccato[c.sigla] = true; f.classList.remove('giallo'); ricalcola(); });
      f.addEventListener('change', () => { toccato[c.sigla] = true; f.classList.remove('giallo'); ricalcola(); });
      if (f.tagName === 'INPUT') f.addEventListener('focus', () => f.select());
    }
    d.appendChild(f); box.appendChild(d);
  });
}

function nuovo() {
  toccato = {}; $('esito').innerHTML = '';
  C.forEach(c => {
    const f = $('f_' + c.sigla); if (!f) return;
    f.classList.remove('giallo');
    if (c.sigla === 'anno') f.value = new Date().getFullYear();
    else if (c.sigla === 'mese') f.value = new Date().getMonth() + 1;
    else {
      f.value = '';
      const v = ULT.valori && ULT.valori[c.sigla];
      if (c.proponi && c.come === 'scrivi' && typeof v === 'number') { f.value = fmt(v); f.classList.add('giallo'); }
    }
  });
  ricalcola();
}

function ricalcola() {
  sc = {};
  Object.keys(P).forEach(k => { if (typeof P[k] === 'number') sc[k] = P[k]; });
  C.forEach(c => { sc[c.sigla] = 0; });
  C.forEach(c => {
    const f = $('f_' + c.sigla); if (!f || c.come !== 'scrivi') return;
    sc[c.sigla] = c.sigla === 'mese' ? Number(f.value) : num(f.value);
  });
  for (let giro = 0; giro < 4; giro++) {
    C.forEach(c => {
      if (c.come === 'scrivi') return;
      const f = $('f_' + c.sigla);
      if (c.come === 'proponi' && toccato[c.sigla] && f) { sc[c.sigla] = num(f.value); return; }
      try {
        const v = valuta(c.formula, sc);
        sc[c.sigla] = (typeof v === 'number' && isFinite(v)) ? v : 0;
        if (f && giro === 3) f.value = fmt(sc[c.sigla]);
      } catch (e) { sc[c.sigla] = 0; }
    });
  }
  const s = squadratura(), el = $('sq');
  if (!sc.netto) { el.textContent = 'Compila il netto'; el.className = ''; }
  else if (Math.abs(s) < 0.005) { el.textContent = 'Squadratura 0,00: pronto'; el.className = 'ok'; }
  else { el.textContent = 'Squadratura ' + fmt(s); el.className = 'ko'; }
}

function squadratura() {
  let att = 0;
  C.forEach(c => { if (c.squadratura === 'piu') att += sc[c.sigla]; else if (c.squadratura === 'meno') att -= sc[c.sigla]; });
  return r2(sc.netto - att);
}

function mesiOk(t, m) {
  t = String(t || '').trim().toLowerCase();
  if (t === '') return true;
  return t.split(/[;,\s]+/).some(x => x === 'tutti' || (x === 'ordinari' && m >= 1 && m <= 12) || Number(x) === m);
}

function scritture() {
  const out = { gnu: [], errori: [], somma: 0, data: dataCompetenza(sc.anno, sc.mese) };
  const datore = String(P.datore || ''); let somma = 0;
  S.forEach((s, i) => {
    if (!s.attiva || !mesiOk(s.mesi, sc.mese)) return;
    let imp;
    try { imp = valuta(s.importo, sc); } catch (e) { out.errori.push('Scrittura ' + (i + 1) + ': la formula "' + s.importo + '" non va (' + e.message + ').'); return; }
    if (typeof imp !== 'number' || !isFinite(imp)) { out.errori.push('Scrittura ' + (i + 1) + ': la formula non dà un numero.'); return; }
    const cent = r2(imp); if (cent === 0) return;
    out.gnu.push([out.data, datore, s.conto_gnucash, s.promemoria_gnucash, cent.toFixed(2)]); somma += cent;
  });
  out.somma = r2(somma); return out;
}

function csvCella(c) { const s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function scaricaCsv(righe, nome) {
  const testo = '\uFEFF' + [['Data', 'Descrizione', 'Conto', 'Promemoria', 'Importo']].concat(righe).map(r => r.map(csvCella).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([testo], { type: 'text/csv' })); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
}

function mostra(cls, righe) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = righe.join('\n'); $('esito').innerHTML = ''; $('esito').appendChild(d); }

function prova() {
  ricalcola(); const x = scritture();
  if (x.errori.length) { mostra('ko', x.errori); return; }
  let h = '<p>Data scritture: <b>' + x.data + '</b> &middot; Netto ' + fmt(sc.netto) + ' &middot; Squadratura ' + fmt(squadratura()) + '</p>';
  h += '<table><tr><th>Conto</th><th>Promemoria</th><th>Importo</th></tr>';
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  x.gnu.forEach(r => { h += '<tr><td>' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td><td class="n">' + r[4].replace('.', ',') + '</td></tr>'; });
  h += '<tr><td colspan="2"><b>Somma righe</b></td><td class="n"><b>' + fmt(x.somma) + '</b></td></tr></table>';
  h += x.somma === 0 ? '<div class="msg ok">Le righe GnuCash quadrano.</div>' : '<div class="msg ko">Le righe GnuCash non quadrano: squilibrio ' + fmt(x.somma) + '.</div>';
  h += '<p>Nulla è stato salvato.</p>';
  $('esito').innerHTML = h;
}

async function archivia(forza) {
  ricalcola();
  if (!(sc.anno > 0) || !(sc.mese >= 1 && sc.mese <= 14)) { mostra('ko', ['Anno o mese non validi.']); return; }
  if (!sc.netto) { mostra('ko', ['Il netto è vuoto o zero.']); return; }
  const diff = squadratura();
  if (Math.abs(diff) > 0.01) { mostra('ko', ['La squadratura (' + fmt(diff) + ') non è a zero. Controlla i dati.']); return; }
  const x = scritture();
  if (x.errori.length) { mostra('ko', x.errori); return; }
  if (!x.gnu.length) { mostra('ko', ['Non c\'è nessuna scrittura da salvare.']); return; }
  if (Math.abs(x.somma) >= 0.01 && !forza) {
    if (!confirm('Le righe GnuCash non quadrano (somma ' + fmt(x.somma) + '). Archivio lo stesso?')) return;
  }
  $('bArc').disabled = true;
  const valori = {}; C.forEach(c => { if (c.nel_database && c.sigla !== 'anno' && c.sigla !== 'mese') valori[c.sigla] = sc[c.sigla]; });
  const { error } = await sb.from('ced_cedolini').insert({ profilo_id: PROF.id, anno: sc.anno, mese: sc.mese, datore: String(P.datore || ''), valori });
  $('bArc').disabled = false;
  if (error) {
    mostra('ko', error.code === '23505'
      ? ['Esiste già un cedolino per ' + sc.anno + '/' + sc.mese + ' di questo datore.', 'Non ho salvato nulla.']
      : ['Errore nel salvataggio: ' + error.message]);
    return;
  }
  const mm = sc.mese < 10 ? '0' + sc.mese : String(sc.mese);
  const nome = sc.anno + '_' + mm + '_Cedolino_Gnucash.csv';
  scaricaCsv(x.gnu, nome);
  ULT = { anno: sc.anno, mese: sc.mese, valori: sc.mese <= 12 ? valori : ULT.valori };
  mostra('ok', ['Cedolino ' + sc.anno + '/' + sc.mese + ' archiviato.', 'File scaricato: ' + nome + ' (' + x.gnu.length + ' righe).']);
}

// ==INIZIO_CSV==
function leggiCsv(t) {
  const righe = []; let r = [], c = '', q = false;
  t = t.replace(/^\uFEFF/, '');
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && t[i + 1] === '\n') i++;
      r.push(c); c = ''; if (r.some(x => x !== '')) righe.push(r); r = [];
    } else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); if (r.some(x => x !== '')) righe.push(r); }
  return righe;
}
function preparaImport(righe, caselle, datoreProfilo, profiloId) {
  const norm = s => String(s == null ? '' : s).trim().toLowerCase();
  const out = { righe: [], errori: [] };
  const intest = (righe[0] || []).map(norm);
  const iA = intest.indexOf('anno'), iM = intest.indexOf('mese'), iD = intest.indexOf('datore');
  if (iA < 0 || iM < 0 || iD < 0) { out.errori.push('Nel file mancano le colonne Anno, Mese o Datore.'); return out; }
  const cols = [];
  caselle.forEach(c => {
    if (!c.nel_database || c.sigla === 'anno' || c.sigla === 'mese') return;
    const i = intest.indexOf(norm(c.etichetta)); if (i >= 0) cols.push([c.sigla, i]);
  });
  righe.slice(1).forEach((r, n) => {
    const anno = Number(r[iA]), mese = Number(r[iM]);
    if (!(anno > 0) || !(mese >= 1 && mese <= 14)) { out.errori.push('Riga ' + (n + 2) + ': anno o mese non validi.'); return; }
    const dc = String(r[iD] || '').trim(), mio = norm(dc) === norm(datoreProfilo), valori = {};
    cols.forEach(([sig, i]) => { const v = num(r[i]); valori[sig] = isNaN(v) ? 0 : v; });
    out.righe.push({ profilo_id: mio ? profiloId : null, anno, mese, datore: mio ? datoreProfilo : dc, valori });
  });
  return out;
}
// ==FINE_CSV==

let DAIMPORTARE = [];
$('fcsv').addEventListener('change', async e => {
  const f = e.target.files[0], box = $('rimp'); if (!f) return;
  box.textContent = 'Leggo il file...'; DAIMPORTARE = [];
  const pr = preparaImport(leggiCsv(await f.text()), C, String(P.datore || ''), PROF.id);
  const ex = await sb.from('ced_cedolini').select('anno,mese,datore');
  if (ex.error) { box.textContent = 'Errore: ' + ex.error.message; return; }
  const chiavi = new Set(ex.data.map(x => x.anno + '|' + x.mese + '|' + x.datore));
  let gia = 0;
  pr.righe.forEach(r => { const k = r.anno + '|' + r.mese + '|' + r.datore; if (chiavi.has(k)) gia++; else { chiavi.add(k); DAIMPORTARE.push(r); } });
  const t = ['Righe lette: ' + pr.righe.length, 'Nuove da importare: ' + DAIMPORTARE.length, 'Già presenti (saltate): ' + gia].concat(pr.errori);
  box.innerHTML = ''; const d = document.createElement('div'); d.className = 'msg ' + (pr.errori.length ? 'ko' : 'ok'); d.textContent = t.join('\n'); box.appendChild(d);
  if (DAIMPORTARE.length) {
    const b = document.createElement('button'); b.className = 'p'; b.style.marginTop = '8px'; b.textContent = 'Importa ' + DAIMPORTARE.length + ' cedolini';
    b.onclick = async () => {
      b.disabled = true;
      const { error } = await sb.from('ced_cedolini').insert(DAIMPORTARE);
      if (error) { b.disabled = false; d.className = 'msg ko'; d.textContent = 'Errore: ' + error.message + '\nNon ho importato nulla.'; return; }
      d.className = 'msg ok'; d.textContent = 'Importati ' + DAIMPORTARE.length + ' cedolini.'; b.remove();
      DAIMPORTARE = []; await leggiUltimo(); nuovo();
    };
    box.appendChild(b);
  }
});

// ===================== STORICO: mese, anni, CU, 730 =====================
let ST = [];
const NM = m => m <= 12 ? MESI[m - 1] : (m === 13 ? 'Tredicesima' : 'Quattordicesima');
const eur = n => { const q = r2(n).toFixed(2).split('.'); return q[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + q[1]; };
const val = (r, k) => Number(r.valori && r.valori[k]) || 0;
const sommaVoce = (rs, k) => r2(rs.reduce((a, r) => a + val(r, k), 0));
const VOCI = () => C.filter(c => c.nel_database && c.sigla !== 'anno' && c.sigla !== 'mese' && !/^(ferie|prm\.)/i.test(c.etichetta));
const anniOk = () => [...new Set(ST.map(r => r.anno))].sort((a, b) => b - a);
function h(tag, p, ...kids) { const e = document.createElement(tag); Object.assign(e, p || {}); kids.flat().forEach(k => e.append(k)); return e; }
function tab(intest, righe, daN) {
  const t = h('table', {}, h('tr', {}, intest.map((x, i) => h('th', { className: i >= daN ? 'n' : '' }, x))));
  righe.forEach(r => t.append(h('tr', { className: r.tot ? 'tot' : '' }, r.map((x, i) => h('td', { className: i >= daN ? 'n' : '' }, String(x))))));
  return h('div', { className: 'sc' }, t);
}
async function leggiStorico() {
  const q = await sb.from('ced_cedolini').select('*').order('anno').order('mese');
  ST = q.error ? [] : q.data; return q.error;
}
function selAnno(anni, anno, fn) { const s = h('select', { onchange: () => fn(Number(s.value)) }, anni.map(a => new Option(a, a, false, a === anno))); return h('div', { className: 'riga' }, h('label', {}, 'Anno'), s); }
async function apriPannello(id) {
  const box = $(id); box.textContent = 'Carico...';
  const err = await leggiStorico();
  if (err) { box.textContent = 'Errore: ' + err.message; return null; }
  if (!ST.length) { box.textContent = 'Nessun cedolino archiviato.'; return null; }
  box.innerHTML = ''; return box;
}
function vai(t) {
  ['ins', 'mese', 'anni', 'cu', '730'].forEach(x => {
    $('t_' + x).classList.toggle('nasc', x !== t);
    const b = document.querySelector('#nav [data-t="' + x + '"]'); if (b) b.classList.toggle('on', x === t);
  });

  if (t === 'mese') renderMese(); if (t === 'anni') renderAnni(); if (t === 'cu') renderCu(); if (t === '730') render730();
}

// ---- Mese: elenco, modifica, elimina, scarica ----
async function renderMese(anno) {
  const box = await apriPannello('t_mese'); if (!box) return;
  const anni = anniOk(); anno = anno || anni[0];
  const t = h('table', {}, h('tr', {}, ['Mese', 'Datore', 'Retribuz.', 'Irpef netto', 'Netto', ''].map(x => h('th', {}, x))));
  ST.filter(r => r.anno === anno).sort((a, b) => (a.mese <= 12 ? a.mese : a.mese === 13 ? 12.5 : 6.5) - (b.mese <= 12 ? b.mese : b.mese === 13 ? 12.5 : 6.5)).forEach(r =>
    t.append(h('tr', {}, h('td', {}, NM(r.mese)), h('td', {}, r.datore), h('td', { className: 'n' }, eur(val(r, 'retr'))),
      h('td', { className: 'n' }, eur(val(r, 'irpef_netto'))), h('td', { className: 'n' }, eur(val(r, 'netto'))),
      h('td', {}, h('button', { onclick: () => apriMese(r.id) }, 'Apri')))));
  box.append(selAnno(anni, anno, renderMese), h('div', { className: 'sc' }, t),
    h('p', {}, h('button', { onclick: scaricaStorico }, 'Scarica tutto lo storico (CSV)')), h('div', { id: 'edit' }));
}
function apriMese(id) {
  const r = ST.find(x => x.id === id), ed = $('edit'), campi = {}; ed.innerHTML = '';
  const riga = (et, valore, k) => { const i = h('input', { value: valore, inputMode: 'decimal' }); campi[k] = i; return h('div', { className: 'riga' }, h('label', {}, et), i); };
  ed.append(h('h2', {}, 'Modifica: ' + NM(r.mese) + ' ' + r.anno + ' - ' + r.datore),
    riga('Anno', r.anno, '#anno'), riga('Mese (1-14)', r.mese, '#mese'), riga('Datore', r.datore, '#datore'));
  campi['#datore'].style = 'text-align:left';
  VOCI().forEach(c => ed.append(riga(c.etichetta, eur(val(r, c.sigla)), c.sigla)));
  const msg = h('div', { className: 'msg' }); msg.style.display = 'none';
  const errore = t => { msg.className = 'msg ko'; msg.style.display = ''; msg.textContent = t; };
  ed.append(h('div', { className: 'riga' },
    h('button', { className: 'p', onclick: async () => {
      const valori = Object.assign({}, r.valori);
      VOCI().forEach(c => { const n = num(campi[c.sigla].value); valori[c.sigla] = isNaN(n) ? 0 : n; });
      const anno = Number(campi['#anno'].value), mese = Number(campi['#mese'].value);
      if (!(anno > 0) || !(mese >= 1 && mese <= 14)) { errore('Anno o mese non validi.'); return; }
      const { error } = await sb.from('ced_cedolini').update({ anno, mese, datore: campi['#datore'].value.trim(), valori }).eq('id', r.id);
      if (error) { errore(error.code === '23505' ? 'Esiste già un cedolino con quell\'anno, mese e datore.' : 'Errore: ' + error.message); return; }
      renderMese(anno);
    } }, 'Salva modifiche'),
    h('button', { onclick: async () => {
      if (!confirm('Elimino definitivamente il cedolino ' + NM(r.mese) + ' ' + r.anno + ' (' + r.datore + ')?')) return;
      const { error } = await sb.from('ced_cedolini').delete().eq('id', r.id);
      if (error) { errore('Errore: ' + error.message); return; }
      renderMese(r.anno);
    } }, 'Elimina'),
    h('button', { onclick: () => { ed.innerHTML = ''; } }, 'Chiudi')), msg);
  ed.scrollIntoView();
}
function scaricaStorico() {
  const cs = C.filter(c => c.nel_database && c.sigla !== 'anno' && c.sigla !== 'mese');
  const testa = ['Anno', 'Mese'].concat(cs.map(c => c.etichetta), ['Datore']);
  const righe = ST.map(r => [r.anno, r.mese].concat(cs.map(c => '"' + eur(val(r, c.sigla)) + '"'), [csvCella(r.datore)]));
  const testo = '\uFEFF' + [testa].concat(righe).map(r => r.join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([testo], { type: 'text/csv' }));
  a.download = 'Reddito_Database_' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

// ---- 730: simulazione ----
// ==INIZIO_730==
function irpefLorda(anno, R) {
  const sc = anno >= 2026 ? [[28000, 0.23], [50000, 0.33], [Infinity, 0.43]] : [[28000, 0.23], [50000, 0.35], [Infinity, 0.43]];
  let prec = 0, imp = 0;
  sc.forEach(([lim, al]) => { if (R > prec) imp += (Math.min(R, lim) - prec) * al; prec = lim; });
  return r2(imp);
}
function detrLavoro(R, giorni) {
  let d = 0;
  if (R <= 0) d = 0; else if (R <= 15000) d = 1955; else if (R <= 28000) d = 1910 + 1190 * (28000 - R) / 13000;
  else if (R <= 50000) d = 1910 * (50000 - R) / 22000;
  if (d > 0 && R > 25000 && R <= 35000) d += 65;
  return r2(d * Math.min(giorni, 365) / 365);
}
function ulterioreDetr(anno, R, giorni) {
  if (anno < 2025 || R <= 20000 || R > 40000) return 0;
  const d = R <= 32000 ? 1000 : 1000 * (40000 - R) / 8000;
  return r2(d * Math.min(giorni, 365) / 365);
}
function calcola730(anno, rs, giorni, altre, oneri) {
  const imponibile = r2(rs.reduce((a, r) => a + (Number(r.valori && r.valori.imp_irpef) || 0), 0));
  const ritenute = r2(rs.reduce((a, r) => a + (Number(r.valori && r.valori.irpef_netto) || 0), 0));
  const reddito = r2(Math.max(0, imponibile - oneri)), lorda = irpefLorda(anno, reddito), dl = detrLavoro(reddito, giorni), ul = ulterioreDetr(anno, reddito, giorni);
  const netta = r2(Math.max(0, lorda - dl - ul - altre));
  return { imponibile, oneri, reddito, lorda, dl, ul, altre, netta, ritenute, saldo: r2(netta - ritenute) };
}

  box.append(selAnno(anni, anno, render730), campo('Giorni di lavoro nell\'anno (max 365)', 'giorni'), campo('Altre detrazioni in euro', 'altre'), campo('Oneri deducibili non già in busta paga', 'oneri'),

    h('p', {}, 'Addizionali già trattenute: regionale ' + eur(sommaVoce(rs, 'add_reg')) + ', comunale ' + eur(sommaVoce(rs, 'add_com')) + ' (non ricalcolate).'),
    h('p', {}, 'Aliquote ' + (anno >= 2026 ? '2026: 23% fino a 28.000, 33% fino a 50.000, 43% oltre.' : anno + ': 23% fino a 28.000, 35% fino a 50.000, 43% oltre.') +
      ' Non incluse: familiari a carico, oneri detraibili, TFR, somma non imponibile fino a 20.000 euro; inserisci a mano ciò che manca nei campi sopra. È una stima di controllo, non sostituisce il 730 né un professionista.'));
}
